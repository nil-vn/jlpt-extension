version: '3'

vars:
  APP_NAME: "jlpt-study-companion"
  BIN_DIR: "bin"

tasks:
  frontend:build:
    desc: Build the Svelte frontend used by Wails.
    cmds:
      - npm run build:wails

  build:
    desc: Build the Wails desktop application for the current platform.
    deps:
      - frontend:build
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.APP_NAME}} .

  linux:build:
    desc: Build the Wails desktop application for Linux.
    deps:
      - frontend:build
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.APP_NAME}} .

  windows:build:
    desc: Build the Wails desktop application for Windows.
    deps:
      - frontend:build
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=windows GOARCH=amd64 go build -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .

  darwin:build:
    desc: Build the Wails desktop application for macOS.
    deps:
      - frontend:build
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=darwin GOARCH=amd64 go build -o {{.BIN_DIR}}/{{.APP_NAME}} .

  build:windows:
    desc: Build the Wails desktop application for Windows.
    deps:
      - frontend:build
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=windows GOARCH=amd64 go build -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .

  dev:
    desc: Run the Wails desktop application in development mode.
    cmds:
      - wails3 dev
